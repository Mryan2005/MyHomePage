<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="baidu-site-verification" content="codeva-pDmOelIWT8" />
    <title>Mryan2005's Index</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.7.2/css/all.css" rel="stylesheet">
    <script src="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.7.2/js/all.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const images = [
                'assets/images/bg1.png',
                'assets/images/bg2.png',
                'assets/images/bg3.jpg',
                'assets/images/bg4.jpg',
                'assets/images/bg5.png',
                'assets/images/bg6.jpg',
                'assets/images/bg7.jpg',
                'assets/images/bg8.jpg',
            ];
            const randomImage = images[Math.floor(Math.random() * images.length)];
            const background = document.getElementById('site-background');
            document.documentElement.style.setProperty(
                '--site-background-image',
                `url('${randomImage}')`
            );
            if (background) {
                background.style.backgroundImage = `url('${randomImage}')`;
            }
            const img = new Image();
            img.src = randomImage;
            img.onload = () => {
                const body = document.body;
                body.style.minHeight = '100vh';                     // 确保至少占满一屏
                body.style.margin = '0';                            // 去掉默认边距
                window.dispatchEvent(new Event('site-background-ready'));
            };
        });
    </script>
    <style>
        body {
            background: #b9dfff;
        }

        #site-background {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            transition: background-image 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <svg class="liquid-filter-defs" aria-hidden="true" focusable="false">
        <defs>
            <filter id="liquid-glass-refraction" x="-8%" y="-80%" width="116%" height="260%"
                    color-interpolation-filters="sRGB">
                <feTurbulence type="fractalNoise" baseFrequency="0.006 0.045" numOctaves="2"
                              seed="8" result="liquid-noise" />
                <feGaussianBlur in="liquid-noise" stdDeviation="0.65" result="soft-noise" />
                <feDisplacementMap in="SourceGraphic" in2="soft-noise" scale="17"
                                   xChannelSelector="R" yChannelSelector="B" />
            </filter>
        </defs>
    </svg>
    <div id="site-background" aria-hidden="true"></div>
    <app-root></app-root>
</body>
</html>
