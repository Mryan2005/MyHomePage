<div class="status-window">
    <div *ngIf="loading" class="loading">Loading...</div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <div *ngIf="!loading && !error && allDiscussions.length === 0" class="empty">No Task found</div>

    <div *ngIf="!loading && !error && allDiscussions.length" class="status-layout">
        <section class="list-panel">
            <div class="list-title">夜桜閑客最近过得怎么样了？</div>
            <div class="list-divider"></div>
            <div class="list-subtitle">如果你是一位一年没见的朋友请你喝咖啡，我该和你说些什么好呢？</div>
            <div class="issue-list">
                @for (discussion of discussions; track discussion.url) {
                    <button
                        type="button"
                        class="issue-row"
                        [class.active]="selectedDiscussion?.url === discussion.url"
                        (click)="selectDiscussion(discussion)"
                    >
                        <div class="row-main">
                            <div class="issue-title">{{ discussion.title }}</div>
                            <div class="issue-time">{{ getTimeAgo(discussion.createdAt) }}</div>
                        </div>
                        <span
                            class="badge"
                            [class.cancelled]="getStatus(discussion) === 'Cancelled'"
                            [class.pause]="getStatus(discussion) === 'Pause'"
                            [class.working]="getStatus(discussion) === 'Ongoing'"
                            [class.done]="getStatus(discussion) === 'Done'"
                        >
                            {{ getStatusLabel(discussion) }}
                        </span>
                    </button>
                }
                @if (discussions.length === 0) {
                    <div class="empty">没有匹配的任务</div>
                }
            </div>
        </section>

        <section class="detail-panel">
            <div class="detail-header">
                <h2>{{ selectedDiscussion?.title }}</h2>
                <span
                    class="badge"
                    [class.cancelled]="selectedDiscussion && getStatus(selectedDiscussion) === 'Cancelled'"
                    [class.pause]="selectedDiscussion && getStatus(selectedDiscussion) === 'Pause'"
                    [class.working]="selectedDiscussion && getStatus(selectedDiscussion) === 'Ongoing'"
                    [class.done]="selectedDiscussion && getStatus(selectedDiscussion) === 'Done'"
                >
                    {{ selectedDiscussion ? getStatusLabel(selectedDiscussion) : '' }}
                </span>
            </div>
            <div class="meta-line">
            </div>
            <div class="body-text" [innerHTML]="selectedDiscussionBodyHtml"></div>
        </section>
    </div>
</div>
