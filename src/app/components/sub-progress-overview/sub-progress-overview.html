<div class="overlay-bg" [class.active]="show" (click)="onOverlayClick($event)">
    <div class="progress-panel" [class.active]="show">
        <div class="panel-header">
            <h2>Life Progress</h2>
            <button class="close-btn" (click)="close()">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <path d="M1 1l12 12M13 1L1 13"/>
                </svg>
            </button>
        </div>

        <div *ngIf="loading" class="loading">Loading...</div>
        <div *ngIf="error" class="error">{{ error }}</div>

        <div *ngIf="!loading && !error" class="panel-body">
            <!-- 分段进度条 -->
            <div class="bar-container">
                <div class="bar-track">
                    @for (seg of segments; track seg.key) {
                        @if (seg.pct > 0) {
                            <span
                                class="bar-segment"
                                [style.width.%]="seg.pct"
                                [style.background-color]="seg.color"
                                [attr.data-label]="seg.label"
                            ></span>
                        }
                    }
                </div>
            </div>

            <!-- 图例 -->
            <div class="legend">
                @for (seg of segments; track seg.key) {
                    <div class="legend-item">
                        <span class="legend-dot" [style.background-color]="seg.color"></span>
                        <span class="legend-label">{{ seg.label }}</span>
                        <span class="legend-pct">{{ seg.pctText }}</span>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
