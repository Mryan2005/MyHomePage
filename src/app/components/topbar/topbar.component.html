<header id="topbar">
    <div class="bar items-center">
        <div class="barItemBox" id="barTitleBox" (click)="clickBarButton1('Home')">
            <div class="bar_title bar_p">Home</div>
        </div>
        <div class="barItemBox" id="barWorksBox" (click)="clickBarButton1('Works')">
            <div class="bar_p">Works</div>
        </div>
        <div class="barItemBox" id="barTravelBox" (click)="clickBarButton1('Travel')">
            <div class="bar_p">Travel</div>
        </div>
        <div class="barItemBox" id="barStatusBox" (click)="clickBarButton1('Now')">
            <div class="bar_p">Now</div>
        </div>
        <div class="barItemBox" id="barFilesBox" (click)="clickBarButton1('Files')">
            <div class="bar_p">Files</div>
        </div>
        <div class="barItemBox" id="barContactBox" (click)="clickBarButton1('Contact')">
            <div class="bar_p">Contact</div>
        </div>
        <div
            class="barItemBox help-button"
            id="barHelpBox"
            [class.menu-open]="showHelpMenu"
            (click)="toggleHelpMenu($event)"
        >
            <div class="bar_p">Help</div>
            @if (showHelpMenu) {
                <div class="help-dropdown" (click)="$event.stopPropagation()">
                    @for (item of helpMenuItems; track item.label) {
                        <button type="button" class="help-menu-item" (click)="item.action()">
                            {{ item.label }}
                        </button>
                    }
                </div>
            }
        </div>
        <div class="bar_right"></div>
        @if (isFilesPage) {
            <div class="barItemBox ping-button" (click)="onPingClick($event)">
                <div class="bar_p ping-label">Ping</div>
            </div>
        }
        @if (isTaskPage) {
            <div
                class="barItemBox topbar-filter"
                [class.active]="websitePramas.showPause"
                (click)="toggleShowPause($event)"
            >
                <div class="bar_p">暂缓</div>
            </div>
            <div
                class="barItemBox topbar-filter"
                [class.active]="websitePramas.showDone"
                (click)="toggleShowDone($event)"
            >
                <div class="bar_p">已完成</div>
            </div>
            <div class="barItemBox progress-button" (click)="onProgressClick($event)">
                <div class="bar_p progress-label">Statistics</div>
            </div>
        }
        <!-- <div class="appleItemDiv" style="padding: 0 1px; margin: 0 0.1rem"></div>
        <div class="barItemBox">
            <div class="appleItem">
                <p class="bar_p">{{ currentTime }}</p>
            </div>
        </div> -->
    </div>
</header>

@if (showAboutModal) {
    <div class="about-modal-overlay" (click)="closeAboutModal()">
        <div class="about-modal" (click)="$event.stopPropagation()">
            <div class="about-modal-header">
                <h3>{{ aboutModalTitle }}</h3>
                <button type="button" class="about-modal-close" (click)="closeAboutModal()">✕</button>
            </div>
            <div class="about-modal-body" [innerHTML]="aboutModalContent"></div>
        </div>
    </div>
}
